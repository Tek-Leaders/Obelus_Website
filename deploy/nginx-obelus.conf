# nginx for obelus.in: the built React site plus the Django API on one origin.
#
# Serving both from the same domain is what makes the frontend's relative
# /api/... calls work in production, exactly as the Vite proxy does in
# development - no CORS, no API host baked into the JavaScript.
#
# Install:
#   sudo cp deploy/nginx-obelus.conf /etc/nginx/sites-available/obelus
#   sudo ln -s /etc/nginx/sites-available/obelus /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then get certificates:  sudo certbot --nginx -d obelus.in -d www.obelus.in

server {
    listen 80;
    server_name obelus.in www.obelus.in;

    # certbot rewrites this block to redirect to https and adds the
    # listen 443 server below.

    root /var/www/obelus/dist;
    index index.html;

    # The product tour video is ~40 MB; allow it to stream rather than
    # buffering, and do not let uploads of that size hit the API.
    client_max_body_size 2m;

    # ---- API -----------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # views.py reads the first entry of this to record the submitter's IP
        # and to rate limit; without it every request looks like 127.0.0.1.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # settings.py trusts this to know the request arrived over TLS;
        # without it SECURE_SSL_REDIRECT causes an infinite redirect loop.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # ---- Django admin --------------------------------------------------
    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin CSS/JS, written here by `manage.py collectstatic`.
    location /static/ {
        alias /var/www/obelus/backend/staticfiles/;
        access_log off;
        expires 30d;
    }

    # ---- The React site ------------------------------------------------
    # Vite fingerprints these filenames, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Every other path is a client-side route (/team, /about, /contact...),
    # so it must fall back to index.html. Without this line, a visitor who
    # lands directly on https://obelus.in/team or refreshes the page gets a
    # 404 from nginx - React Router never gets the chance to run.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
